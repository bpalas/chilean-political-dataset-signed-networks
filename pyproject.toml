[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chilean-political-dataset"
version = "2.0.0"
description = "2.1M Spanish-language news articles with 914 hand-annotated signed political relations (2013-2024)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["political networks", "signed graphs", "Spanish NLP", "dataset", "Chile"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Creative Commons Attribution Non Commercial",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black>=23.0", "ruff>=0.1"]
viz = ["matplotlib>=3.8", "plotly>=5.0"]

[project.urls]
Homepage = "https://github.com/bpalas/chilean-political-dataset-signed-networks"
Repository = "https://github.com/bpalas/chilean-political-dataset-signed-networks"
Documentation = "https://github.com/bpalas/chilean-political-dataset-signed-networks/tree/main/docs"
Issues = "https://github.com/bpalas/chilean-political-dataset-signed-networks/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["text2sg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
